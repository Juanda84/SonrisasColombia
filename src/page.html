<!doctype html>
<html lang="$locale">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="robots" content="$robots">
<meta name="theme-color" content="#0b0a09">
<meta property="og:type" content="website">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:site_name" content="Sonrisas Colombia">
<meta name="twitter:card" content="summary_large_image">
$seo
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bodoni-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script defer src="/assets/config.js"></script>
<script defer src="/assets/site.js"></script>
</head>
<body>
<a class="skip" href="#main">$skip</a>
<header class="hdr" data-header>
  <div class="wrap hdr__in">
    <a class="hdr__brand" href="$home" aria-label="Sonrisas Colombia"><img src="/assets/logo-transparent.webp" width="632" height="386" alt="Sonrisas Colombia"></a>
    <nav class="hdr__nav" id="nav" aria-label="$menu">$nav</nav>
    <div class="hdr__act">
      <a class="hdr__lang" href="$otherUrl" lang="$otherLocale" hreflang="$otherLocale" data-lang>$otherLabel</a>
      $headerCta
      <button class="hdr__menu" type="button" aria-controls="nav" aria-expanded="false" data-menu><span></span><span></span><span class="sr">$menu</span></button>
    </div>
  </div>
</header>
<main id="main">
$sections
</main>
<footer class="ftr">
  <div class="wrap ftr__top">
    <a class="ftr__brand" href="$home"><img src="/assets/logo-transparent.webp" width="632" height="386" alt="Sonrisas Colombia" loading="lazy"></a>
    <p class="ftr__line">$footerLine</p>
    <nav aria-label="$menu">$nav</nav>
  </div>
  <div class="wrap ftr__bottom">
    <span>© $year $copyright</span>
    <span><button type="button" class="ftr__link" data-privacy>$privacy</button><a class="ftr__link" href="$otherUrl" lang="$otherLocale" hreflang="$otherLocale" data-lang>$otherLabel</a></span>
  </div>
</footer>
$floating
<div class="mbar">$mobileBar</div>
<dialog class="dlg" id="privacy-dialog" aria-labelledby="privacy-title">
  <button type="button" class="dlg__x" data-close aria-label="$close">×</button>
  <h2 id="privacy-title">$privacyTitle</h2>
  <p>$privacyText</p>
  $privacyMore
  <button type="button" class="btn btn--ink" data-close>$close</button>
</dialog>
<script id="page-data" type="application/json">$client</script>
</body>
</html>
