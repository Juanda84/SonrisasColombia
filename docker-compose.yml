services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
        PUBLIC_GTM_ID: ${PUBLIC_GTM_ID:-}
        ENABLE_INDEXING: ${ENABLE_INDEXING:-false}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
