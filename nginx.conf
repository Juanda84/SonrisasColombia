server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ =404; }
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location /assets/ { try_files $uri =404; expires 1d; }
    location = /assets/config.js { expires -1; }
}
