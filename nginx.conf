server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Páginas HTML, robots, sitemap y llms.txt: el navegador debe revisar siempre si hay versión nueva.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Archivos con huella (?v=...): se guardan un año; al cambiar el archivo cambia la URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Configuración pública: nunca en caché.
    location = /assets/config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
}
